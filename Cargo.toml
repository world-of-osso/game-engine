[workspace]
members = ["launcher", "tools"]
default-members = ["launcher"]
exclude = ["godot"]
resolver = "3"

# Local crate patch; provenance, retirement condition and regression tests in ../bevy-patches/README.md.
[patch.crates-io]
ktx2-rw = { path = "../bevy-patches/ktx2-rw" }

[profile.dev]
debug = 1
incremental = true
split-debuginfo = "unpacked"
