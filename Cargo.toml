[workspace]
members = ["launcher", "tools"]
default-members = ["launcher"]
exclude = ["godot", "vendor/ktx2-rw", "vendor/taffy"]
resolver = "3"

# Local crate patch; provenance and retirement conditions in vendor/README.md.
[patch.crates-io]
ktx2-rw = { path = "vendor/ktx2-rw" }

[profile.dev]
debug = 1
incremental = true
split-debuginfo = "unpacked"
