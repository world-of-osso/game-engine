[package]
name = "game-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace]
members = ["vendor/bevy_transform", "vendor/bevy_pbr", "vendor/bevy_render"]

[dependencies]
bevy = { version = "0.19", features = ["default", "bevy_dev_tools", "bevy_audio", "wav", "ktx2"] }
bevy_hanabi = "0.19"
# Bevy's aggregate trace feature omits transform-worker spans; reuse its existing crate.
bevy_transform = { version = "0.19", default-features = false, features = ["trace"], optional = true }
image-blp = "1"
peercred-ipc = { git = "https://github.com/Osso/peercred-ipc.git", tag = "v0.2.0", optional = true }
tokio = { version = "1", features = ["rt", "sync", "net", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8"
webp = "0.3"
half = "2"
glob = { version = "0.3", optional = true }
libc = { version = "0.2", optional = true }
clap = { version = "4", features = ["derive"] }
lightyear = { version = "0.28", features = ["client", "netcode", "replication", "udp"] }
# Observe existing replication notifications instead of polling equipment each frame.
bevy_replicon = { version = "0.41.1", default-features = false, features = ["client"] }
shared = { git = "https://github.com/world-of-osso/shared-protocol.git", rev = "e25c79d" }
game-api = { git = "https://github.com/world-of-osso/game-api.git", rev = "3827ad6" }
ui-toolkit = { git = "https://github.com/world-of-osso/ui-toolkit.git", rev = "3f301b3" }
osso_asset_resolver = { package = "asset-resolver", path = "../asset-resolver", default-features = false, optional = true }
ab_glyph = "0.2"
quick-js = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
ktx2-rw = "0.2.4"
notify = "7"
directories = "5"
arboard = { version = "3", features = ["wayland-data-control"] }
raw-window-handle = "0.6"
# Empty-window baseline: reuse winit and paint only OS-requested frames in shared memory.
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
softbuffer = { version = "0.4.8", default-features = false, features = ["wayland", "wayland-dlopen"] }
binrw = "0.15.1"
rusqlite = { version = "0.35", features = ["bundled"] }

[[bin]]
name = "game-engine-cli"
path = "src/bin/game-engine-cli/main.rs"
required-features = ["ipc"]

[features]
default = ["ipc", "casc", "dev"]
dev = ["bevy/dynamic_linking"]
# Diagnostic-only per-span CPU clocks; normal builds retain no profiling layer.
cpu-system-profile = ["bevy/trace", "dep:bevy_transform", "libc"]
ipc = ["peercred-ipc", "libc", "glob"]
casc = ["dep:osso_asset_resolver", "osso_asset_resolver/casc"]

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "parser_benches"
harness = false

# Local Bevy patches; provenance and retirement conditions in vendor/README.md.
[patch.crates-io]
bevy_transform = { path = "vendor/bevy_transform" }
bevy_pbr = { path = "vendor/bevy_pbr" }
bevy_render = { path = "vendor/bevy_render" }

[patch."https://github.com/world-of-osso/shared-protocol.git"]
shared = { path = "../shared-protocol" }

[patch."https://github.com/world-of-osso/ui-toolkit.git"]
ui-toolkit = { path = "../ui-toolkit" }

[patch."ssh://git@github.com/world-of-osso/ui-toolkit-macros.git"]
ui-toolkit-macros = { path = "../ui-toolkit-macros" }

[profile.dev]
debug = 1
incremental = true
split-debuginfo = "unpacked"

# Optimize deps in debug builds (Bevy is unusably slow at opt-level 0)
[profile.dev.package."*"]
opt-level = 2

# Workspace membership must not de-optimize the formerly registry dependencies.
[profile.dev.package.bevy_pbr]
opt-level = 2

[profile.dev.package.bevy_transform]
opt-level = 2

[profile.dev.package.bevy_render]
opt-level = 2
