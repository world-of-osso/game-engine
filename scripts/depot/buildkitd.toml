# Shared game-engine builder GC budget; apply with scripts/setup-builder.sh.
# GC is periodic, not a hard instantaneous storage limit. Keep the whole cache
# within a 100 GB target rather than reserving a warm cache for every agent slot.
[worker.oci]
  gc = true

  [[worker.oci.gcpolicy]]
    all = true
    reservedSpace = "10GB"
    maxUsedSpace = "100GB"
    minFreeSpace = "80GB"
