[build]
jobs = 8
target-dir = "target"

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold", "-C", "link-arg=-Wl,--thread-count=4"]

[alias]
bd = "build --features dev"
rd = "run --features dev"
# Bundled QuickJS requires GNU on Windows; Unix socket IPC stays disabled.
bw = "build --target x86_64-pc-windows-gnu --bin game-engine --no-default-features --features casc,dev"
rw = "run --target x86_64-pc-windows-gnu --bin game-engine --no-default-features --features casc,dev"
