[build]
jobs = 8
target-dir = "target"

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold", "-C", "link-arg=-Wl,--thread-count=4"]

[alias]
bd = "build --features dev"
rd = "run --features dev"
# Native Windows: Unix socket IPC is unsupported; keep CASC and dynamic linking.
bw = "build --bin game-engine --no-default-features --features casc,dev"
rw = "run --bin game-engine --no-default-features --features casc,dev"
