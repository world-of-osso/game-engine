[package]
name = "game-engine-ui-model"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
autotests = false

# One harness avoids compiling/linking the same UI dependencies for 93 binaries.
# Keep each suite in its own module so fixtures and helpers remain isolated.
[[test]]
name = "integration"
path = "tests/integration.rs"

# The pending-load boundary requires a fresh process-global item catalog.
[[test]]
name = "item_catalog_pending"
path = "tests/item_catalog_pending.rs"

[dependencies]
# Shared chat timestamps: local `HH:MM:SS`, as the root client's chat frame formats them.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Original Options views use the core's persisted input-binding and nameplate-style types.
game-engine-core = { path = "../core" }
# Shared unit-resource snapshots derive serialization for native unit-frame state.
serde = { version = "1", features = ["derive"] }
shared = { git = "https://github.com/world-of-osso/shared-protocol.git", rev = "cff29ac9376428fb298647d3899787a3d4033c6f" }
ui-toolkit = { package = "ui-toolkit-core", path = "../../../ui-toolkit/core" }

[dev-dependencies]
# Decode the authentic multi-area world-quest pin census in behavioral tests.
serde_json = "1"

