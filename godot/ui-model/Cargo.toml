[package]
name = "game-engine-ui-model"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[features]
# Original Bevy-only source tests remain enabled by the engine's existing `dev` feature.
dev = []

[dependencies]
# Original Options views use the core's persisted input-binding and nameplate-style types.
game-engine-core = { path = "../core" }
shared = { git = "https://github.com/world-of-osso/shared-protocol.git", rev = "e25c79d" }
ui-toolkit = { package = "ui-toolkit-core", path = "../../../ui-toolkit-godot-conversion/core" }

