[package]
name = "game-engine-ui-model"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
autotests = false

# One harness avoids compiling/linking the same UI dependencies for 93 binaries.
# Keep each suite in its own module so fixtures and helpers remain isolated.
[[test]]
name = "integration"
path = "tests/integration.rs"

[dependencies]
# Shared chat timestamps: local `HH:MM:SS`, as the root client's chat frame formats them.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Original Options views use the core's persisted input-binding and nameplate-style types.
game-engine-core = { path = "../core" }
# Shared unit-resource snapshots derive serialization for native unit-frame state.
serde = { version = "1", features = ["derive"] }
shared = { git = "https://github.com/world-of-osso/shared-protocol.git", rev = "7ccaa40b3736c9d2d962dc2bf04932238d873716" }
ui-toolkit = { package = "ui-toolkit-core", path = "../../../ui-toolkit/core" }

