[package]
name = "game-engine-network"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[features]
# `Replica` constructors that bypass the wire, for host crates' unit tests.
test-util = []

[dependencies]
bevy = { version = "0.19", default-features = false, features = ["bevy_state"] }
lightyear = { version = "0.28", features = ["client", "netcode", "replication", "udp"] }
bevy_replicon = { version = "0.41.1", default-features = false, features = ["client"] }
# Named directly to disable lightyear's replicon client and read its payload channels.
lightyear_replication = { version = "0.28", default-features = false }
lightyear_transport = { version = "0.28", default-features = false }
serde = "1"
# Execute the original synchronous ui.* script compiler, without Godot objects in JS.
quick-js = "0.4"
shared = { git = "https://github.com/world-of-osso/shared-protocol.git", rev = "74e67cf" }

[dev-dependencies]
# Offline frozen-source extraction uses the same local archive reader; never a runtime dependency.
osso_asset_resolver = { package = "asset-resolver", path = "../../../asset-resolver" }
# Real NPC fixture oracle: DB2 selection, compositor and authored M2 texture slots.
game-engine-core = { path = "../core" }
# Fixture SQL setup and WAL-safe snapshots without a host sqlite3 executable.
rusqlite = { version = "0.35", features = ["bundled", "backup"] }
# Fixtures kill their owned client process group (kill(-pgid)) and set PR_SET_PDEATHSIG.
libc = "0.2"
# Tap decoded fingerprints before shared's validation without consuming the messages.
lightyear_messages = { version = "0.28", default-features = false }
