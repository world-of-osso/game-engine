[package]
name = "game-engine-ui-pvp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
autotests = false

[[test]]
name = "integration"
path = "tests/integration.rs"

[dependencies]
# Shared chrome, unit rows, tooltip/map/faction data retain their base owners.
game-engine-ui-model = { path = "../ui-model" }
# Queue/match/arena authority remains the original shared wire snapshots.
shared = { git = "https://github.com/world-of-osso/shared-protocol.git", rev = "7773df472ceaf0595ea4ba5962fa7d2363b55e45" }
ui-toolkit = { package = "ui-toolkit-core", path = "../../../ui-toolkit/core" }
