[package]
name = "game-engine-ui-collections"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
autotests = false

[[test]]
name = "integration"
path = "tests/integration.rs"

# Keep scene-flag/data-root source switching in its original isolated process.
[[test]]
name = "active_db2"
path = "tests/active_db2.rs"

[dependencies]
# Authored wardrobe/model-scene catalogs retain their existing core ownership.
game-engine-core = { path = "../core" }
# Item catalogs, shared chrome/tooltips and data-root state remain single base owners.
game-engine-ui-model = { path = "../ui-model" }
# The moved pet-journal snapshot already derives Deserialize; retain base's serde features.
serde = { version = "1", features = ["derive"] }
# Authoritative wardrobe/Trading Post snapshots keep existing wire type identity.
shared = { git = "https://github.com/world-of-osso/shared-protocol.git", rev = "1660f5bf4a8a18b8a4d6d0c8cc0962fc62ba0024" }
ui-toolkit = { package = "ui-toolkit-core", path = "../../../ui-toolkit/core" }
