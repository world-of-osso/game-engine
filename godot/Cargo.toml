[workspace]
members = ["cli", "core", "network", "rust", "session", "ui-model"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"

[patch."ssh://git@github.com/world-of-osso/ui-toolkit-macros.git"]
ui-toolkit-macros = { path = "../../ui-toolkit-macros" }

[patch.crates-io]
ktx2-rw = { path = "../vendor/ktx2-rw" }
taffy = { path = "../vendor/taffy" }

[patch."https://github.com/world-of-osso/shared-protocol.git"]
shared = { path = "../../shared-protocol" }

[profile.dev]
debug = 1
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2

# Shared M2/BLP/ADT parsers and texture composition run per model load;
# unoptimized they dominated character-select loading.
[profile.dev.package.game-engine-core]
opt-level = 2

# glob is both the CLI's normal dependency and clang-sys's build dependency.
# Pin debug info so adding the CLI to cargo test --workspace does not rebuild
# glob -> clang-sys -> bindgen -> ktx2-rw with another host profile hash.
[profile.dev.package.glob]
debug = 1

# Replica decodes every replicated component change on the main thread each frame.
[profile.dev.package.game-engine-network]
opt-level = 2

# The extension's per-frame work (world units, nameplates, UI sync) runs on Godot's
# main thread; unoptimized it held the in-world client to 5 fps.
[profile.dev.package.game-engine-godot]
opt-level = 2
