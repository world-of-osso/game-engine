name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Root workspace tests; Godot workspace uses the build helper (docs/remote-builds.md).
jobs:
  test:
    # KTX 4.4.0 fails to build its SSE encoder on ubuntu-26.04. Return to
    # ubuntu-latest when the KTX build succeeds there with SSE enabled.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout game-engine
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev mold cmake pkg-config

      - name: Test launcher and tools
        run: ./run-tests.sh
