name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Format check only. Cargo cannot load the root workspace here: its ktx2-rw patch
# points at sibling ../bevy-patches, which is not published. The godot/ workspace
# builds and tests on Depot (docs/remote-builds.md). Run ./run-tests.sh locally.
jobs:
  rustfmt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout game-engine
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt

      # Same files as `cargo fmt -p game-engine-launcher -p game-engine-tools --check`.
      - name: Rustfmt launcher and tools
        run: git ls-files -z 'launcher/*.rs' 'tools/*.rs' | xargs -0 rustfmt --check --edition 2024
